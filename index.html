<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>柠柠专属的故事本</title>
<style>
  :root {
    --paper: #F7F4EC;
    --ink: #1C1B18;
    --mist: #7A8B99;
    --line: #D8D2C4;
    --accent: #7A8B99;
  }
  /* 番外分风格主题（由 style 字段驱动） */
  body.st-sweet   { --accent: #B98686; --line: #E3D5D2; }  /* 蜜糖 · 豆沙 */
  body.st-funny   { --accent: #B08A3E; --line: #E4DCC8; }  /* 逗趣 · 杏黄 */
  body.st-serious { --accent: #6B7F94; --line: #D3DAE0; }  /* 谈心 · 雾蓝 */
  body.st-night   { --accent: #6A6488; --line: #DBD8E4; }  /* 晚安 · 暮紫 */
  body.st-story   { --accent: #7A8B99; }                    /* 正篇 · 原灰蓝 */
  body.st-sweet .gu, body.st-funny .gu, body.st-serious .gu,
  body.st-night .gu, body.st-sweet .no, body.st-funny .no,
  body.st-serious .no, body.st-night .no { color: var(--accent); }
  body.st-sweet .bar > i, body.st-funny .bar > i,
  body.st-serious .bar > i, body.st-night .bar > i { background: var(--accent); }
  body.st-sweet #bars, body.st-funny #bars,
  body.st-serious #bars, body.st-night #bars { stroke: var(--accent); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 48px 32px;
    text-align: center;
  }
  .frame {
    max-width: 420px;
    width: 100%;
  }
  .kicker {
    font-size: 12px;
    letter-spacing: 0.5em;
    color: var(--mist);
    margin-bottom: 40px;
  }
  .gu {
    font-size: 15px;
    letter-spacing: 0.4em;
    color: var(--mist);
    margin-bottom: 16px;
  }
  .dedic {
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--mist);
    margin-bottom: 10px;
  }
  h1 {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
  }
  .no {
    font-size: 13px;
    color: var(--mist);
    letter-spacing: 0.3em;
    margin-bottom: 48px;
  }
  .wave { margin: 0 auto 48px; display: block; }
  .quote {
    font-size: 14px;
    line-height: 2.1;
    color: var(--ink);
    opacity: 0.75;
    margin-bottom: 48px;
    white-space: pre-line;
  }
  .pending {
    font-size: 14px;
    letter-spacing: 0.35em;
    color: var(--mist);
  }
  .pending::after {
    content: "";
    display: block;
    width: 32px;
    height: 1px;
    background: var(--line);
    margin: 20px auto 0;
  }
  .date {
    margin-top: 48px;
    font-size: 12px;
    letter-spacing: 0.25em;
    color: var(--mist);
  }
  /* 柠柠变形风格池：每次扫码随机换装，可爱/活泼/感动轮换 */
  .nn span { display:inline-block; }
  .nn.v1 span { font-family:"YouYuan","幼圆",sans-serif; color:#E08E79; font-size:1.25em; }
  .nn.v2 span { font-family:"KaiTi","楷体",serif; color:#A9744F; font-size:1.2em; }
  .nn.v3 span { font-family:"YouYuan","幼圆",sans-serif; color:transparent;
                -webkit-text-stroke:1px #40342A; font-size:1.25em; }
  .nn.v4 span { font-family:"YouYuan","幼圆",sans-serif; font-size:1.25em; }
  .nn.v4 span:nth-child(1) { color:#E08E79; transform:rotate(-7deg) translateY(-2px); }
  .nn.v4 span:nth-child(2) { color:#7FA08C; transform:rotate(7deg) translateY(2px); }
  .nn.v5 span { font-size:1.25em; background:linear-gradient(180deg,#E08E79,#A9744F);
                -webkit-background-clip:text; background-clip:text; color:transparent; }
  .nn.v6 span { font-family:"KaiTi","楷体",serif; font-size:1.25em; color:#A9744F; }
  .nn.v6 span:nth-child(1) { transform:translateY(-4px); }
  .nn.v6 span:nth-child(2) { transform:translateY(4px); }
  .nn.v7 span { font-family:"KaiTi","楷体",serif; color:#B9A896;
                font-size:1.15em; letter-spacing:.5em; opacity:.85; }
  .nn.v8 span { font-family:"YouYuan","幼圆",sans-serif; color:#E08E79; font-size:1.25em;
                text-shadow:2px 2px 0 #F3E2D6; }
  /* player */
  .player { display: none; }
  .player.on { display: block; }
  .playbtn {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-size: 24px;
    cursor: pointer;
    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, color .2s;
  }
  .playbtn.playing { background: var(--ink); color: var(--paper); }
  .bar {
    width: 100%; height: 2px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    cursor: pointer;
  }
  .bar > i {
    display: block; height: 100%; width: 0%;
    background: var(--ink);
  }
  .time {
    margin-top: 12px;
    font-size: 12px;
    color: var(--mist);
    letter-spacing: 0.15em;
    font-family: Georgia, serif;
  }
  footer {
    margin-top: 64px;
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--mist);
    opacity: 0.7;
  }
  /* 解锁进度徽标 */
  .progress {
    position: fixed;
    top: 18px; right: 20px;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--mist);
    opacity: 0.65;
    font-family: Georgia, serif;
  }
  /* 深夜模式：23:00-5:00 自动切换 */
  body.night { --paper:#242220; --ink:#D9D3C7; --mist:#8D857A; --line:#3B3833; }
  body.night .playbtn.playing { background: var(--ink); color:#242220; }
  body.night .nn.v3 span { -webkit-text-stroke:1px #D9D3C7; }
  .late {
    display: none;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--mist);
    margin-top: 20px;
  }
  body.night .late { display: block; }
</style>
</head>
<body>
  <div class="frame">
    <div class="kicker" id="kick">睡前故事电台</div>
    <div class="gu" id="gu"></div>
    <div class="dedic">讲给<span id="ningning" class="nn"></span>的</div>
    <h1 id="title"></h1>
    <div class="no" id="no"></div>

    <svg class="wave" id="wave" width="200" height="24" viewBox="0 0 200 24">
      <line x1="0" y1="12" x2="200" y2="12" stroke="#D8D2C4" stroke-width="1"/>
      <g id="bars" stroke="#7A8B99" stroke-width="1.4" stroke-linecap="round"></g>
    </svg>

    <div class="quote" id="quote"></div>

    <div class="pending" id="pending">本章录制中</div>

    <div class="player" id="player">
      <button class="playbtn" id="play">▶</button>
      <div class="bar" id="bar"><i id="prog"></i></div>
      <div class="time"><span id="cur">0:00</span> · <span id="dur">--:--</span></div>
      <audio id="audio" preload="metadata"></audio>
    </div>

    <div class="date" id="date"></div>
    <div class="late">这么晚还没睡？</div>
  </div>
  <div class="progress" id="progress"></div>
  <footer id="foot">某年某月某章 · 讲给你听</footer>

<script>
  // 生成装饰声波
  (function () {
    const g = document.getElementById('bars');
    let x = 8, seed = 7;
    while (x < 192) {
      seed = (seed * 16807) % 2147483647;
      const h = 3 + (seed % 16);
      const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x1', x); l.setAttribute('x2', x);
      l.setAttribute('y1', 12 - h / 2); l.setAttribute('y2', 12 + h / 2);
      g.appendChild(l);
      x += 5 + (seed % 7);
    }
  })();

  // 柠柠换装：随机挑一个风格，连续两次不重复
  (function () {
    const el = document.getElementById('ningning');
    if (!el) return;
    el.innerHTML = '<span>柠</span><span>柠</span>';
    let v;
    try {
      const last = sessionStorage.getItem('nnv');
      do { v = 'v' + (1 + Math.floor(Math.random() * 8)); } while (v === last);
      sessionStorage.setItem('nnv', v);
    } catch (e) { v = 'v' + (1 + Math.floor(Math.random() * 8)); }
    el.classList.add(v);
  })();

  const params = new URLSearchParams(location.search);
  const ch = (params.get('ch') || '01').padStart(2, '0');

  // 深夜模式：23:00 - 5:00 自动生效
  (function () {
    const h = new Date().getHours();
    if (h >= 23 || h < 5) document.body.classList.add('night');
  })();

  // 解锁进度：她扫过的每一章都会被记住（存在她自己手机上，不会上传）
  function markUnlocked(id) {
    try {
      const set = new Set(JSON.parse(localStorage.getItem('nn_unlocked') || '[]'));
      set.add(id);
      localStorage.setItem('nn_unlocked', JSON.stringify([...set]));
      return set;
    } catch (e) { return new Set([id]); }
  }
  function renderProgress(set, total) {
    const el = document.getElementById('progress');
    if (!total) { el.style.display = 'none'; return; }
    el.textContent = '已解锁 ' + set.size + ' / ' + total;
  }

  // 番外风格 → 页面文案映射
  const CHAT_STYLES = {
    sweet:   { label: '蜜糖时刻', foot: '顺便说给你听' },
    funny:   { label: '胡说八道', foot: '笑完记得睡' },
    serious: { label: '认真说话', foot: '这些话要紧' },
    night:   { label: '晚安之后', foot: '睡前最后一句' },
    chat:    { label: '悄悄话',   foot: '顺便说给你听' }
  };

  fetch('./stories.json')
    .then(r => r.json())
    .then(data => {
      const pool = data.chapters.concat(data.extras || [], data.blanks || []);
      const c = pool.find(x => x.id === ch);
      if (!c) { document.getElementById('title').textContent = '未找到章节'; return; }

      // 解锁进度：只统计正篇 38 章
      const total = data.chapters.length;
      const set = markUnlocked(ch);
      renderProgress(set, total);

      // 背面小尾巴同步到网页（与卡片一致，55 张各一句）
      const CH_FOOT = {"01":"从困境里捞出来的希望，给你","02":"规矩是死的，你是活的","03":"跑掉的不是蛊，是坏心情","04":"把面具摘下来，这里有热茶","05":"太阳晒着，月亮陪着你","06":"四只猴子都没你机灵","07":"平凡的我，讲给不平凡的你","08":"虚荣是空的，这一页是满的","09":"九天之高，不敌你一笑","10":"门的另一边，是我","11":"石人挡路，故事绕行","12":"失败可以，失去你不行","13":"意义不在远方，在耳边","14":"生命蔚蓝，晚安是好颜色","15":"路很长，我一直在","16":"梦要追，觉也要睡","17":"自己的路自己走，我看着","18":"伟大不响，爱很响","19":"跌倒的地方，也能开花","20":"自由如羽，落在你枕边","21":"哭完记得喝口水","22":"恐惧退散，这一页护身","23":"大事小事，都不及你事","24":"勇气充值成功，余额充足","25":"爱这个字，念给你听","26":"坚持住了，就奖励下一章","27":"财富是每晚一个故事","28":"疯，是一种清醒的浪漫","29":"自由万岁，你也万岁","30":"仇恨放下，故事拿起","31":"强者打怪，弱者睡觉","32":"困境到此为止，晚安从这里开始","33":"大力掰开噩梦，温柔放好今晚","34":"努力的姑娘，值得这一章","35":"壁再厚，也隔不住声音","36":"此境有且只有一个听众","37":"光阴带不走的，都录进去了","38":"三十八章讲完了，故事没有"};
      const EX_FOOT = {"X01":"希望是深夜的备用电池","X02":"第一天的勇气，续杯无限","X03":"勇气对半分，快乐翻倍","X04":"年轮一圈一圈，圈住我们","X05":"歌词会停，喜欢不会","X06":"潮水退了，我没退","X07":"跑调的地方，笑点在此","X08":"不是第五章，是爱你那一章"};
      const BLANK_FOOT = {"39":"这一页在等一个新故事","40":"未来的某一晚，提前问好","41":"空白不是没有，是还没发生","42":"此处预留：一个没讲过的夜晚","43":"新故事招募中，主角是你","44":"空白页不着急，我们慢慢来","45":"以后某个晚上，这里会响","46":"留给明天，留给以后的你","47":"故事未完，此处续一笔"};
      const footEl = document.getElementById('foot');
      if (c.type === 'chat') footEl.textContent = EX_FOOT[c.id] || '';
      else if (c.type === 'blank') footEl.textContent = BLANK_FOOT[c.id] || '';
      else footEl.textContent = CH_FOOT[c.id] || '';

      // 番外：按内容风格切换主题
      if (c.type === 'chat') {
        const st = CHAT_STYLES[c.style] || CHAT_STYLES.chat;
        document.body.classList.add('st-' + (c.style || 'chat'));
        document.getElementById('kick').textContent = '番外 · ' + st.label;
        document.title = (c.title || ch) + ' · 番外';
      }

      // 空白卡：不编号、不留标题，页面留空
      if (c.type === 'blank') {
        document.getElementById('no').style.display = 'none';
        document.getElementById('pending').textContent = '录制中';
        document.title = '柠柠专属的故事本';
      }

      document.getElementById('gu').textContent = c.gu || '';
      document.getElementById('title').textContent = c.title || (c.type === 'chat' || c.type === 'blank' ? '' : '待写的一章');
      document.getElementById('no').textContent = 'No.' + ch;
      document.getElementById('quote').textContent = c.quote || '';
      document.getElementById('date').textContent = c.date;
      document.title = (c.title || ch) + ' · 睡前故事';

      if (c.audio) {
        const audio = document.getElementById('audio');
        const play = document.getElementById('play');
        const prog = document.getElementById('prog');
        const bar = document.getElementById('bar');
        const cur = document.getElementById('cur');
        const dur = document.getElementById('dur');
        audio.src = './' + c.audio;
        document.getElementById('pending').style.display = 'none';
        document.getElementById('player').classList.add('on');

        const fmt = s => isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '--:--';
        play.onclick = () => audio.paused ? audio.play() : audio.pause();
        audio.onplay = () => { play.textContent = '❚❚'; play.classList.add('playing'); };
        audio.onpause = () => { play.textContent = '▶'; play.classList.remove('playing'); };
        audio.ontimeupdate = () => {
          prog.style.width = (audio.currentTime / audio.duration * 100 || 0) + '%';
          cur.textContent = fmt(audio.currentTime);
        };
        audio.onloadedmetadata = () => dur.textContent = fmt(audio.duration);
        bar.onclick = e => {
          const r = bar.getBoundingClientRect();
          audio.currentTime = (e.clientX - r.left) / r.width * audio.duration;
        };
      }
    })
    .catch(() => { document.getElementById('title').textContent = '加载失败，请稍后再扫'; });
</script>
</body>
</html>
